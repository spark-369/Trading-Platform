# Test configuration - uses H2 in-memory so tests never touch a real database.
spring.application.name=trading-platform

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration=86400000

trading.welcome-balance=10000.00
trading.fee-rate=0.001

app.cors.allowed-origins=http://localhost:3000

logging.level.root=WARN
logging.level.com.ftp.backend=INFO
