spring.application.name=trading-platform
server.port=${SERVER_PORT:8080}

# PostgreSQL Configuration
# Values MUST be supplied through environment variables in production.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/trading_platform}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:mysecretpassword}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=30000

# JPA/Hibernate Configuration
# `validate` is production safe: schema is managed by migrations, not Hibernate.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# The bundled schema.sql is a reference/manual migration script, not something
# Spring should run automatically on an existing database.
spring.sql.init.mode=never

# JWT Configuration
# Override with a strong, unique secret in every environment (min 32 bytes, base64).
jwt.secret=${JWT_SECRET:ZmluZG1vdW50YWluYW55Ym9keWhpc3RvcnlzaWxrcHJpbmNpcGxlZW1wdHlwcm9ncmU=}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# Trading configuration
trading.welcome-balance=${TRADING_WELCOME_BALANCE:10000.00}
trading.fee-rate=${TRADING_FEE_RATE:0.001}

# CORS - comma separated list of allowed origins
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Logging
logging.level.org.springframework.security=INFO
logging.level.com.ftp.backend=INFO
